[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "switchsafe"
version = "0.1.0"
description = "Failure-aware ASR evaluation for APAC voice-agent workflows"
requires-python = ">=3.11"
dependencies = [
  "faster-whisper>=1.1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8"]

[project.scripts]
switchsafe = "switchsafe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

